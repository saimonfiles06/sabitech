name: sabitech-despliegue

services:
  # Backend: Laravel con Apache
  web:
    container_name: backend
    build: .
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./app:/var/www/html

  # Base de datos: MySQL
  db:
    container_name: bbdd
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sabitech
      MYSQL_USER: sabitech_user
      MYSQL_PASSWORD: Aula_Sabitech_2026
      MYSQL_ROOT_PASSWORD: Aula_Root_2026
    volumes:
      - mysql_data:/var/lib/mysql

  # Frontend: React con Vite
  frontend:
    container_name: frontend
    build: ../frontend
    ports:
      - "${IP_FRONTEND:-127.0.0.1}:5173:5173"
    environment:
      API_DESTINO: http://web:80
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - web

volumes:
  mysql_data:
  frontend_node_modules: